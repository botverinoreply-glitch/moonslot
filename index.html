<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonslot | Lua Obfuscator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        moon: {
                            bg: '#050505',
                            card: '#0f0f13',
                            border: '#27272a',
                            purple: '#9333ea',
                            purpledark: '#7e22ce',
                            text: '#e4e4e7',
                            muted: '#a1a1aa'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #e4e4e7; }
        /* Efecto de brillo detrás de la luna */
        .moon-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.15) 0%, rgba(5, 5, 5, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }
        /* Scrollbar personalizado */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f13; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9333ea; }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            width: 20px;
            height: 20px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-hidden">

    <div class="moon-glow"></div>

    <!-- ================= LOGIN SECTION ================= -->
    <div id="login-section" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-moon-card border border-moon-border p-10 rounded-2xl shadow-2xl w-full max-w-md text-center backdrop-blur-sm relative overflow-hidden">
            <!-- Brillo superior -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-moon-purple to-transparent opacity-50"></div>
            
            <div class="w-20 h-20 mx-auto mb-6 bg-black rounded-full flex items-center justify-center border border-moon-border shadow-[0_0_20px_rgba(147,51,234,0.3)]">
                <!-- Icono de Luna (Puedes cambiarlo por tu logo) -->
                <i class="fa-solid fa-moon text-4xl text-moon-purple"></i>
            </div>
            
            <h1 class="text-4xl font-extrabold mb-2 tracking-tight">Moon<span class="text-moon-purple">slot</span></h1>
            <p class="text-moon-muted mb-8 text-sm">Accede a la plataforma de ofuscación</p>
            
            <button id="google-login" class="bg-white text-black font-semibold py-3 px-4 rounded-lg w-full flex items-center justify-center gap-3 hover:bg-gray-200 transition-colors duration-200">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5">
                Continuar con Google
            </button>
        </div>
    </div>

    <!-- ================= APP SECTION (Oculto al inicio) ================= -->
    <div id="app-section" class="hidden flex-grow flex flex-col w-full max-w-7xl mx-auto p-4 md:p-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 bg-moon-card border border-moon-border p-4 rounded-xl">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-moon text-2xl text-moon-purple"></i>
                <h1 class="text-2xl font-bold">Moon<span class="text-moon-purple">slot</span> <span class="text-xs text-moon-muted font-normal px-2 py-1 bg-black rounded border border-moon-border">v1.0</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-sm text-moon-muted hidden md:block"></span>
                <button id="logout-btn" class="text-red-400 hover:text-red-300 text-sm border border-red-900/50 hover:border-red-500 px-4 py-2 rounded-lg transition-colors bg-red-900/10">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>Cerrar Sesión
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow">
            
            <!-- Panel Izquierdo: Input -->
            <div class="bg-moon-card border border-moon-border rounded-xl p-5 flex flex-col shadow-lg">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-sm font-semibold text-moon-text"><i class="fa-solid fa-code text-moon-purple mr-2"></i>Código Lua Original</label>
                    <button id="clear-btn" class="text-xs text-moon-muted hover:text-white transition-colors"><i class="fa-solid fa-trash mr-1"></i>Limpiar</button>
                </div>
                
                <textarea id="input-code" class="w-full flex-grow bg-black text-green-400 p-4 rounded-lg border border-moon-border focus:outline-none focus:border-moon-purple font-mono text-sm resize-none h-64 lg:h-auto" placeholder="-- Pega tu script de Roblox aquí...&#10;print('Hello Moonslot')" spellcheck="false"></textarea>
                
                <!-- Controles -->
                <div class="mt-5 space-y-4">
                    <div>
                        <label class="block text-xs text-moon-muted mb-1">Firma / Nombre de la VM</label>
                        <input type="text" id="custom-signature" class="w-full bg-black border border-moon-border text-white p-2.5 rounded-lg focus:outline-none focus:border-moon-purple text-sm" placeholder="Ej: [Moon], Infinity, Ghost" value="[Moon]">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-moon-muted mb-1">Nivel de Protección</label>
                        <select id="obfuscation-mode" class="w-full bg-black border border-moon-border text-white p-2.5 rounded-lg focus:outline-none focus:border-moon-purple text-sm appearance-none cursor-pointer">
                            <option value="normal">Normal (Base64 + XOR)</option>
                            <option value="medium" selected>Medium (Math Junk + Anti-Logger)</option>
                            <option value="max">Max (VM Bytecode - Próximamente)</option>
                            <option value="custom">Custom (Configuración manual)</option>
                        </select>
                    </div>

                    <button id="obfuscate-btn" class="w-full bg-moon-purple hover:bg-moon-purpledark text-white font-bold py-3 px-6 rounded-lg transition-all duration-200 shadow-[0_0_15px_rgba(147,51,234,0.4)] hover:shadow-[0_0_25px_rgba(147,51,234,0.6)] flex items-center justify-center">
                        <i class="fa-solid fa-shield-halved mr-2"></i> Proteger Script
                    </button>
                </div>
            </div>

            <!-- Panel Derecho: Output -->
            <div class="bg-moon-card border border-moon-border rounded-xl p-5 flex flex-col shadow-lg relative">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-sm font-semibold text-moon-text"><i class="fa-solid fa-lock text-moon-purple mr-2"></i>Código Protegido</label>
                    <!-- Indicador de copiado -->
                    <span id="copy-success" class="text-xs text-green-400 opacity-0 transition-opacity duration-300"><i class="fa-solid fa-check mr-1"></i>Copiado</span>
                </div>
                
                <textarea id="output-code" class="w-full flex-grow bg-black text-moon-purple p-4 rounded-lg border border-moon-border focus:outline-none font-mono text-sm resize-none h-64 lg:h-auto" readonly placeholder="El código ofuscado aparecerá aquí..."></textarea>
                
                <button id="copy-btn" class="mt-5 w-full bg-moon-border hover:bg-gray-700 text-white font-bold py-3 rounded-lg transition-colors flex items-center justify-center">
                    <i class="fa-regular fa-copy mr-2"></i> Copiar Código
                </button>
            </div>

        </div>
    </div>

    <!-- Enlazamos el archivo JS -->
    <script type="module" src="app.js"></script>
</body>
  </html>
